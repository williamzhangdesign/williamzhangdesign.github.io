<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="apple-touch-icon" sizes="180x180" href="images/favicon_io/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon_io/favicon-16x16.png">
  <link rel="manifest" href="images/favicon_io/site.webmanifest">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>William Zhang</title>

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css"
    integrity="sha384-HSMxcRTRxnN+Bdg0JdbxYKrThecOKuH5zCYotlSAcp1+c8xmyTe9GYg1l9a69psu" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lato&display=swap" rel="stylesheet">

  <link rel="stylesheet" type="text/css" href="css/html5reset.css">
  <link rel="stylesheet" type="text/css" href="css/style.css">

  <!-- ✅ Responsive background image styling -->
  <style>
    .hero-background {
      width: 100%;
      aspect-ratio: 7 / 19;
      background-image: url('images/mu.png'); /* Desktop */
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center center;
      background-attachment: scroll;
      margin-bottom: 2em;
    }

    @media (max-width: 768px) {
      .hero-background {

        background-image: url('images/mu_mobile.png'); /* Mobile */
    background-position: top center; /* Align top if content is higher up */
     padding-bottom: 220em;

        
      }
    }
  </style>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=UA-151251727-1"></script>
  <script src="myscripts.js"></script>
</head>

<body onmousemove="raiseBar(event)">
  <div style="display: none;" class="preload">
    <img src="images/logo_hover.png">
  </div>

  <nav id="pogger" class="nav">
    <a href="https://bulky-variations-238741.framer.app/">
      <div class="logo"></div>
    </a>
    <div id="mainListDiv" class="main_list">
      <ul class="navlinks">
        <li><a class='navi' target="_blank"
            href="https://drive.google.com/file/d/1tJ-ryxh_Kg9Oci4PQrroSXubIdvTAY3_/view?usp=sharing">Resumé</a></li>
        <li><a class='navi' href="https://www.linkedin.com/in/william-h-zhang/">Linkedin</a></li>
      </ul>
    </div>
    <span class="navTrigger">
      <i></i>
      <i></i>
      <i></i>
    </span>
  </nav>

  <script>
    var freeze = true;
    window.onscroll = function () {
      if (window.pageYOffset > 50) {
        document.getElementById("pogger").style.opacity = 0;
        document.getElementById("pogger").style.visibility = "none";
        document.getElementById("pogger").style.pointerEvents = "none";
        freeze = false;
        console.log("unfreeze");
      } else {
        document.getElementById("pogger").style.opacity = 1;
        document.getElementById("pogger").style.visibility = "auto";
        document.getElementById("pogger").style.pointerEvents = "auto";
        freeze = true;
        console.log("freeze");
      }
    }

    function raiseBar(event) {
      if (freeze) return;
      var y = event.clientY;
      if (y < 110) {
        console.log("hi");
        document.getElementById("pogger").style.opacity = 1;
        document.getElementById("pogger").style.visibility = "auto";
        document.getElementById("pogger").style.pointerEvents = "auto";
      } else {
        document.getElementById("pogger").style.opacity = 0;
        document.getElementById("pogger").style.visibility = "none";
        document.getElementById("pogger").style.pointerEvents = "none";
      }
    }
  </script>

  <section id="mobileMenu" class="home"></section>

  <div style="" class="container-fluid" id="intro">

    <!-- ✅ Responsive background image div -->
    <div class="hero-background"></div>

    <footer>
      <p><hr class="footerline"></p>
      <p style="margin-top: 1em;" id="foot" class="portfolio_description">
        <a style = "font-size: 1.5em; margin-left: 2em; color: lightblue" href = "https://bulky-variations-238741.framer.app/">View Other Works</a>
      </p>
    </footer>
  </div>

  <script>
    $('.navTrigger').click(function () {
      $(this).toggleClass('active');
      console.log("Clicked menu");
      $("#mainListDiv").toggleClass("show_list");
      $("#mainListDiv").fadeIn();
      $("#pogger").toggleClass("extend");
    });
  </script>

  <div class="loader-wrapper">
    <span class="loader"><span class="loader-inner"></span></span>
  </div>
</body>

</html>
